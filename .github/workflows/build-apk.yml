name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter create --platforms=android . --project-name ibadat_mode
      - run: flutter pub get
      - name: Fix telephony namespace
        run: |
          FILE=$(find $HOME/.pub-cache -name build.gradle | grep telephony | head -n 1)
          if [ -n "$FILE" ]; then
            sed -i "s/android {/android {\n    namespace 'com.shounak.telephony'/" "$FILE" || true
          fi
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ibadat-mode-apk
          path: build/app/outputs/flutter-apk/app-release.apk
